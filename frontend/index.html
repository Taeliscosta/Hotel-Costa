<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Costa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Hotel Costa</h1>
    <div class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            Clientes
          </div>
          <div class="card-body">
            <form id="clienteForm">
              <input
                type="text"
                id="nome"
                class="form-control mb-2"
                placeholder="Nome"
              >
              <input
                type="email"
                id="email"
                class="form-control mb-2"
                placeholder="Email"
              >
              <input
                type="text"
                id="telefone"
                class="form-control mb-2"
                placeholder="Telefone"
              >
              <input
                type="text"
                id="cpf"
                class="form-control mb-2"
                placeholder="CPF"
              >
              <button
                type="submit"
                class="btn btn-primary"
              >
                Cadastrar
              </button>
            </form>
            <hr>
            <ul
              id="clientesLista"
              class="list-group"
            ></ul>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            Reservas
          </div>
          <div class="card-body">
            <form id="reservaForm">
              <select
                id="clienteSelect"
                class="form-select mb-2"
              ></select>
              <input
                type="number"
                id="quartoId"
                class="form-control mb-2"
                placeholder="ID do quarto"
              >
              <input
                type="date"
                id="dataEntrada"
                class="form-control mb-2"
              >
              <input
                type="date"
                id="dataSaida"
                class="form-control mb-2"
              >
              <button
                type="submit"
                class="btn btn-success"
              >
                Reservar
              </button>
            </form>
            <hr>
            <ul
              id="reservasLista"
              class="list-group"
            ></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>A
</body>
</html>
